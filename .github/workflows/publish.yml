name: Build and publish Warren container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: warren-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: rogernavelsaker
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build rootless distroless Warren image
        run: |
          nix build .#dockerImage --out-link /tmp/warren-image

      - name: Build Warren agent image
        run: |
          nix build .#agentImage --out-link /tmp/warren-agent-image

      - name: Load and inspect Warren image
        run: |
          docker load --input /tmp/warren-image
          image_tag="$(jq -r '.package as $p | $p.version + (if $p.packageRevision == null then "" else "-r\($p.packageRevision)" end)' nix/package-manifest.json)"
          docker image inspect --format '{{ json .Config.ExposedPorts }}' "warren:$image_tag"

      - name: Load and inspect Warren agent image
        run: |
          docker load --input /tmp/warren-agent-image
          docker run --rm warren-agent:latest pi --version

      - name: Generate Warren image tags
        id: meta-warren
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/rogernavelsaker/warren
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=0.19.2

      - name: Generate Warren agent image tags
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/rogernavelsaker/warren-agent
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Warren image tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta-warren.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag warren:0.19.2-r1 "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Publish Warren agent image tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta-agent.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag warren-agent:latest "$tag"
            docker push "$tag"
          done <<< "$TAGS"
